<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>为您将所有角色的换装信息（含日常装/特殊服装/未出场说明）整理分配为完整总表：主角 4-5 身、配角精简复用，按集数区间标定换装： · 可编辑表格</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6eb; --text:#1f2430; --muted:#6b7280;
    --brand:#2f6feb; --brand-soft:#eaf1fe; --warn:#d97706; --ok:#16a34a; --danger:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1600px;margin:0 auto;padding:18px 18px 80px;}
  header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
  h1{font-size:19px;margin:0 0 6px;line-height:1.45;font-weight:650;letter-spacing:.2px;}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.7;}
  .sub b{color:var(--text);font-weight:600;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);
    position:sticky;top:10px;z-index:30;}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--text);
    padding:7px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:.15s;white-space:nowrap;}
  button:hover{border-color:#c9d2e0;background:#f8fafc;}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  button.primary:hover{background:#255fce;border-color:#255fce;}
  button.ghost{border-style:dashed;color:var(--muted);}
  button.danger{color:var(--danger);border-color:#f3c9c9;background:#fff7f7;}
  button:disabled{opacity:.42;cursor:not-allowed;}
  input[type=search],input[type=text]{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);
    border-radius:9px;outline:none;background:#fff;color:var(--text);}
  input[type=search]:focus,input[type=text]:focus,textarea:focus{border-color:var(--brand);
    box-shadow:0 0 0 3px var(--brand-soft);}
  .grow{flex:1 1 200px;min-width:150px;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 2px 0;}
  .stats b{color:var(--text);font-variant-numeric:tabular-nums;}

  .tablebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 190px);margin-top:12px;}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;}
  thead th{position:sticky;top:0;z-index:6;background:#f8fafc;border-bottom:1px solid var(--line);
    padding:0;text-align:left;vertical-align:top;}
  thead th .th{display:flex;align-items:center;gap:6px;padding:9px 10px;font-weight:650;font-size:12.5px;
    color:#334155;white-space:nowrap;}
  thead th .th .colname{outline:none;border-radius:4px;padding:1px 3px;min-width:20px;}
  thead th .th .colname:focus{background:#fff;box-shadow:0 0 0 2px var(--brand-soft);}
  thead th .th .rm{margin-left:auto;opacity:0;cursor:pointer;color:#94a3b8;font-size:14px;
    padding:0 2px;line-height:1;border:none;background:none;}
  thead th:hover .th .rm{opacity:1;}
  thead th .th .rm:hover{color:var(--danger);}
  .corner{width:52px;min-width:52px;}
  tbody td{border-bottom:1px solid var(--line);padding:0;vertical-align:top;background:#fff;}
  tbody tr:hover td{background:#fbfcfe;}
  tbody tr.hit td{background:#fffbeb;}
  tbody tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--warn);}
  .rownum{width:52px;min-width:52px;text-align:center;color:#9aa4b2;font-size:12px;
    font-variant-numeric:tabular-nums;padding:11px 4px !important;background:#fafbfc !important;
    position:sticky;left:0;z-index:4;border-right:1px solid var(--line);}
  .rownum .del{display:none;cursor:pointer;color:var(--danger);font-size:13px;border:none;
    background:#fff;border-radius:5px;padding:1px 5px;margin-top:4px;}
  tbody tr:hover .rownum .del{display:inline-block;}
  tbody tr:hover .rownum .n{display:none;}
  .cell{min-height:38px;padding:9px 10px;line-height:1.62;outline:none;white-space:pre-wrap;
    word-break:break-word;cursor:text;}
  .cell:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--brand);border-radius:3px;}
  .cell.mark{background:#fff3b8;border-radius:3px;padding:0 2px;}
  .cell:empty:not(:focus)::before{content:attr(data-ph);color:#c3cad6;}
  mark{background:#ffe58a;color:inherit;border-radius:2px;padding:0 1px;}
  .role td:nth-child(2){font-weight:600;}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--brand-soft);
    color:#2b5bc4;margin-left:6px;vertical-align:1px;font-weight:500;cursor:pointer;user-select:none;}
  .tag:hover{background:#dbe7fd;}

  footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 16px;
    display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);}
  .bar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;display:inline-block;margin-right:5px;}
  .dot.dirty{background:var(--warn);}
  .dot.ok{background:var(--ok);}
  kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
    padding:0 5px;background:#fafbfc;color:#475569;}
  .toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:#111827;color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;z-index:99;
    transition:.22s;box-shadow:0 10px 30px rgba(0,0,0,.22);}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  @media (max-width:760px){
    .wrap{padding:12px 10px 78px;} h1{font-size:16px;}
    .tablebox{max-height:none;} footer.bar .left{display:none;}
  }
  @media print{
    @page{size:A3 landscape;margin:10mm;}
    .toolbar,footer.bar,.rownum .del,.toast{display:none !important;}
    body{background:#fff;} .wrap{padding:0;max-width:none;}
    .tablebox{box-shadow:none;border:1px solid #ccc;max-height:none;overflow:visible;}
    thead th{background:#eef2f7 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    tbody td{background:#fff !important;}
    .cell{font-size:10.5px;} .colname{pointer-events:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="flex:1 1 420px;min-width:280px">
      <h1 id="docTitle">为您将所有角色的换装信息（含日常装/特殊服装/未出场说明）整理分配为完整总表：主角 4-5 身、配角精简复用，按集数区间标定换装：</h1>
      <div class="sub">角色服装 / 状态对照总表 · 直接点单元格改字，改完自动存在本机浏览器里</div>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="q" class="grow" placeholder="搜索角色、场景、服装关键词…（Ctrl+F 亦可）">
    <button id="btnClearQ" class="ghost">清空搜索</button>
    <span class="sep"></span>
    <button id="btnAddRow">＋ 加一行</button>
    <button id="btnAddCol" class="ghost">＋ 加一列</button>
    <button id="btnDup" disabled title="选中某行后可用">复制选中行</button>
    <span class="sep"></span>
    <button id="btnUndo" disabled title="Ctrl+Z">↶ 撤销</button>
    <button id="btnRedo" disabled title="Ctrl+Shift+Z">↷ 重做</button>
    <span class="sep"></span>
    <button id="btnSave" class="primary">保存到浏览器</button>
    <button id="btnXlsx">导出 Excel</button>
    <button id="btnCsv" class="ghost">导出 CSV</button>
    <button id="btnJson" class="ghost">导出 JSON</button>
    <button id="btnPrint" class="ghost">打印 / PDF</button>
    <button id="btnReset" class="danger">恢复原始数据</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tablebox">
    <table id="tbl">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<footer class="bar">
  <div class="left">
    <span><span class="dot" id="dot"></span><span id="stateText">已载入</span></span>
    <span>·</span>
    <span>双击/单击单元格直接编辑</span>
    <span>·</span>
    <span><kbd>Tab</kbd> 下一格&nbsp; <kbd>Enter</kbd> 换行&nbsp; <kbd>Ctrl+V</kbd> 可整块粘贴</span>
  </div>
  <div class="right" id="countText"></div>
</footer>
<div class="toast" id="toast"></div>

const KEY = 'costume-table-v1:' + location.pathname;
const $ = s => document.querySelector(s);
const toastEl = $('#toast');
let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 1600); }

/* ---------- 状态 ---------- */
let state = { header: [], rows: [], title: '' };
let selectedRow = -1;
const undoStack = [], redoStack = [];
const MAX_HISTORY = 80;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function snapshot(){ return clone(state); }
function pushHistory(prev){
  undoStack.push(prev);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  refreshHistoryButtons();
}
function refreshHistoryButtons(){
  $('#btnUndo').disabled = undoStack.length === 0;
  $('#btnRedo').disabled = redoStack.length === 0;
}
function commit(prev, {rerender = false} = {}){
  pushHistory(prev);
  if (rerender) render();
  else { updateStats(); }
  markDirty();
  scheduleSave();
}
function markDirty(){ $('#dot').className = 'dot dirty'; $('#stateText').textContent = '有改动未保存'; }
function markSaved(){ $('#dot').className = 'dot ok'; $('#stateText').textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false}); }

/* ---------- 载入 ---------- */
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (raw){
    try {
      const obj = JSON.parse(raw);
      if (obj && Array.isArray(obj.header) && Array.isArray(obj.rows)) { state = obj; return; }
    } catch(e){}
  }
  state = { title: SEED.title, header: SEED.header.slice(), rows: clone(SEED.rows) };
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); markSaved(); toast('已保存到本机浏览器'); }
  catch(e){ toast('保存失败：' + e.message); }
}
let saveT;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ save(); }catch(e){} }, 900); }

/* ---------- 渲染 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const headRow = $('#headRow');
  headRow.innerHTML = '';
  const c0 = document.createElement('th');
  c0.className = 'corner';
  c0.innerHTML = '<div class="th" style="color:#94a3b8;font-weight:500">行</div>';
  headRow.appendChild(c0);

  state.header.forEach((h, ci) => {
    const th = document.createElement('th');
    th.innerHTML = `<div class="th"><span class="colname" contenteditable="true"
        data-ci="${ci}" spellcheck="false">${esc(h)}</span>
        <button class="rm" title="删除本列" data-delcol="${ci}">✕</button></div>`;
    headRow.appendChild(th);
  });

  const body = $('#body');
  body.innerHTML = '';
  state.rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    tr.dataset.ri = ri;
    if (ri === selectedRow) tr.classList.add('sel');
    const no = document.createElement('td');
    no.className = 'rownum';
    no.innerHTML = `<span class="n">${ri + 1}</span><button class="del" title="删除本行" data-delrow="${ri}">删除</button>`;
    tr.appendChild(no);
    state.header.forEach((_, ci) => {
      const td = document.createElement('td');
      const div = document.createElement('div');
      div.className = 'cell';
      div.contentEditable = 'true';
      div.dataset.ri = ri; div.dataset.ci = ci;
      div.dataset.ph = '';
      div.textContent = row[ci] == null ? '' : row[ci];
      td.appendChild(div);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  bindCells();
  updateStats();
  applySearch();
  $('#docTitle').textContent = state.title || '角色服装对照表';
  refreshHistoryButtons();
}

function bindCells(){
  document.querySelectorAll('.cell').forEach(el => {
    el.addEventListener('focus', () => { el.dataset.before = el.textContent; });
    el.addEventListener('blur', () => {
      const ri = +el.dataset.ri, ci = +el.dataset.ci;
      const before = el.dataset.before == null ? '' : el.dataset.before;
      const after = el.textContent.replace(/\u00a0/g, ' ');
      if (before === after) return;
      const prev = snapshot();
      state.rows[ri][ci] = after.trim();
      commit(prev);
      el.textContent = state.rows[ri][ci];
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Tab'){ e.preventDefault(); moveFocus(el, e.shiftKey ? -1 : 1); }
      if (e.key === 'Escape'){ el.textContent = el.dataset.before || ''; el.blur(); }
    });
    el.addEventListener('paste', e => handlePaste(e, el));
  });
  document.querySelectorAll('.colname').forEach(el => {
    el.addEventListener('focus', () => { el.dataset.before = el.textContent; });
    el.addEventListener('blur', () => {
      const ci = +el.dataset.ci, before = el.dataset.before || '';
      const after = el.textContent.trim();
      if (before === after) return;
      const prev = snapshot();
      state.header[ci] = after || ('列' + (ci + 1));
      commit(prev);
      el.textContent = state.header[ci];
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  });
}

function cellEls(){
  return Array.from(document.querySelectorAll('.cell'));
}
function moveFocus(el, dir){
  const all = cellEls();
  const i = all.indexOf(el);
  const next = all[i + dir];
  if (next){ next.focus(); placeCaretEnd(next); }
  else if (dir > 0){ addRow(true); }
}
function placeCaretEnd(el){
  const r = document.createRange(), s = getSelection();
  r.selectNodeContents(el); r.collapse(false); s.removeAllRanges(); s.addRange(r);
}

/* 从 Excel / 表格整块粘贴，自动拆行拆列 */
function handlePaste(e, el){
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  if (!text || (text.indexOf('\t') === -1 && text.indexOf('\n') === -1)) return;
  e.preventDefault();
  const grid = text.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => l.split('\t'));
  const prev = snapshot();
  let ri = +el.dataset.ri, ci = +el.dataset.ci;
  grid.forEach((line, dy) => {
    while (state.rows.length <= ri + dy) state.rows.push(new Array(state.header.length).fill(''));
    line.forEach((v, dx) => {
      while (state.header.length <= ci + dx){ state.header.push('列' + (state.header.length + 1)); state.rows.forEach(r => r.push('')); }
      state.rows[ri + dy][ci + dx] = v.trim();
    });
  });
  commit(prev, {rerender: true});
  toast('已粘贴 ' + grid.length + ' 行 × ' + grid[0].length + ' 列');
}

/* ---------- 增删 ---------- */
function addRow(silent){
  const prev = snapshot();
  state.rows.push(new Array(state.header.length).fill(''));
  commit(prev, {rerender: true});
  requestAnimationFrame(() => {
    const rows = document.querySelectorAll('#body tr');
    const last = rows[rows.length - 1];
    if (last){
      last.scrollIntoView({block:'nearest'});
      if (!silent){ const c = last.querySelector('.cell'); if (c){ c.focus(); placeCaretEnd(c); } }
    }
  });
}
function addCol(){
  const prev = snapshot();
  state.header.push('新列' + (state.header.length + 1));
  state.rows.forEach(r => r.push(''));
  commit(prev, {rerender: true});
  toast('已加到最后一列，点表头可改名');
}
function delRow(ri){
  const prev = snapshot();
  state.rows.splice(ri, 1);
  if (selectedRow === ri) selectedRow = -1;
  commit(prev, {rerender: true});
}
function delCol(ci){
  const name = state.header[ci];
  if (!confirm('删除整列「' + name + '」？可用撤销找回。')) return;
  const prev = snapshot();
  state.header.splice(ci, 1);
  state.rows.forEach(r => r.splice(ci, 1));
  commit(prev, {rerender: true});
}
function dupRow(){
  if (selectedRow < 0) return;
  const prev = snapshot();
  state.rows.splice(selectedRow + 1, 0, clone(state.rows[selectedRow]));
  commit(prev, {rerender: true});
  toast('已复制第 ' + (selectedRow + 1) + ' 行');
}

/* ---------- 搜索 ---------- */
let lastQ = '';
function applySearch(){
  const q = ($('#q').value || '').trim().toLowerCase();
  lastQ = q;
  const trs = document.querySelectorAll('#body tr');
  let hit = 0;
  trs.forEach(tr => {
    let matched = false;
    tr.querySelectorAll('.cell').forEach(c => {
      const raw = c.textContent;
      c.innerHTML = esc(raw);
      if (!q) return;
      const idx = raw.toLowerCase().indexOf(q);
      if (idx >= 0){
        matched = true;
        c.innerHTML = esc(raw.slice(0, idx)) + '<mark>' + esc(raw.substr(idx, q.length)) + '</mark>' + esc(raw.slice(idx + q.length));
      }
    });
    tr.classList.toggle('hit', matched);
    if (matched) hit++;
  });
  $('#stats').innerHTML =
    `角色 <b>${countRoles()}</b> 个 · 记录 <b>${state.rows.length}</b> 条 · 列 <b>${state.header.length}</b> 列` +
    (q ? ` · 命中 <b>${hit}</b> 行` : '');
  $('#countText').textContent = (q ? `搜索「${q}」· 命中 ${hit} 行 · ` : '') + `共 ${state.rows.length} 行`;
}
function countRoles(){
  const uniq = new Set();
  state.rows.forEach(r => { if (r[0] && r[0].trim()) uniq.add(r[0].trim()); });
  return uniq.size;
}
function updateStats(){ applySearch(); }

/* ---------- 导出 ---------- */
function download(name, content, mime){
  const blob = content instanceof Blob ? content : new Blob(['\ufeff' + content], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function toCsv(){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = [state.header.map(q).join(',')];
  state.rows.forEach(r => lines.push(state.header.map((_, i) => q(r[i])).join(',')));
  return lines.join('\r\n');
}
function toXlsx(){
  if (typeof XLSX === 'undefined'){ toast('Excel 引擎未就绪，已导出 CSV（Excel 可直接打开）'); download(baseName() + '.csv', toCsv(), 'text/csv;charset=utf-8'); return; }
  const aoa = [state.header, ...state.rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const lastCi = state.header.length - 1;
  ws['!cols'] = state.header.map((h, i) => {
    const longest = state.rows.reduce((m, r) => Math.max(m, String(r[i] || '').length), String(h).length);
    const w = i === lastCi ? 70 : Math.min(50, Math.max(10, Math.round(longest * 1.75) + 4));
    return {wch: w};
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '服装对照表');
  XLSX.writeFile(wb, baseName() + '.xlsx');
  toast('已导出 Excel');
}
function baseName(){
  return (state.title || '服装表格对照表').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) + '-' + stamp();
}

/* ---------- 事件绑定 ---------- */
$('#q').addEventListener('input', () => applySearch());
$('#btnClearQ').addEventListener('click', () => { $('#q').value = ''; applySearch(); $('#q').focus(); });
$('#btnAddRow').addEventListener('click', () => addRow(false));
$('#btnAddCol').addEventListener('click', addCol);
$('#btnDup').addEventListener('click', dupRow);
$('#btnSave').addEventListener('click', save);
$('#btnCsv').addEventListener('click', () => { download(baseName() + '.csv', toCsv(), 'text/csv;charset=utf-8'); toast('已导出 CSV'); });
$('#btnJson').addEventListener('click', () => { download(baseName() + '.json', JSON.stringify(state, null, 2), 'application/json'); toast('已导出 JSON'); });
$('#btnXlsx').addEventListener('click', toXlsx);
$('#btnPrint').addEventListener('click', () => window.print());
$('#btnReset').addEventListener('click', () => {
  if (!confirm('恢复到最初导入的原始数据？当前所有改动会被清空。')) return;
  const prev = snapshot();
  state = { title: SEED.title, header: SEED.header.slice(), rows: clone(SEED.rows) };
  selectedRow = -1;
  pushHistory(prev);
  render(); markDirty(); scheduleSave();
  toast('已恢复原始数据');
});
$('#btnUndo').addEventListener('click', () => {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  state = undoStack.pop();
  render(); markDirty(); scheduleSave(); refreshHistoryButtons();
  toast('已撤销');
});
$('#btnRedo').addEventListener('click', () => {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  state = redoStack.pop();
  render(); markDirty(); scheduleSave(); refreshHistoryButtons();
  toast('已重做');
});

document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset && t.dataset.delrow != null){ delRow(+t.dataset.delrow); return; }
  if (t.dataset && t.dataset.delcol != null){ delCol(+t.dataset.delcol); return; }
  const tr = t.closest && t.closest('#body tr');
  if (tr && !t.isContentEditable){
    selectedRow = +tr.dataset.ri;
    document.querySelectorAll('#body tr').forEach(r => r.classList.toggle('sel', r === tr));
    $('#btnDup').disabled = false;
  }
});

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); (e.shiftKey ? $('#btnRedo') : $('#btnUndo')).click(); }
  else if (mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); $('#btnRedo').click(); }
  else if (mod && e.key.toLowerCase() === 's'){ e.preventDefault(); save(); }
  else if (mod && e.key.toLowerCase() === 'f'){ e.preventDefault(); $('#q').focus(); $('#q').select(); }
});
window.addEventListener('beforeunload', e => {
  if ($('#dot').classList.contains('dirty')){ save(); }
});

/* ---------- 启动 ---------- */
load();
render();
$('#dot').className = 'dot ok';
$('#stateText').textContent = localStorage.getItem(KEY) ? '已载入本机保存版' : '已载入原始数据';
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
        onerror="window.__xlsxFailed=true"></script>
