name: Seedance 2.0 导演版 v3.0
description: 剧本 → 短剧物料 + Seedance 2.0 视频提示词全流程（v3.0·由 v2.11 升级，采用「导演 3.0 分段式」通用版式）。**3.0 分段规则**：每次「第一大类：基础设定」重新开始 = 一个新的 15 秒 AI 生成分段；每一段都是**自包含的完整提示词**（基础设定 + 氛围画质 + 画面叙述），可单独复制生成；段内镜头重新编号（镜头 1/2/3…）；段尾段首同景接镜。**文档头部通用模块**：元信息卡 → 连续性锁定（全片一致性锚点）→ 素材配置策略 → 断句说明。**段落结构**：段标题用 `# 段N｜主题（场景 · 节奏定位 · 约Xs）`；每段严格按 **第一大类：基础设定**（【连镜承接】三要素——站位/表演/光影承接上一条末帧 + 人物当前剧情状态 + 场景当前状态 + 道具 + 故事背景 + 固定句『声音：不需要配乐，仅保留同期声。』）→ **第二大类：氛围和画质**（风格核心/视觉基调/色彩与影调）→ **第三大类：画面叙述**（分镜头脚本）组织。**画面叙述**：段首写光影与本段人物站位；逐镜头条目用 `#### 镜头 N`（**段内局部编号，不用镜头段号-镜号**），镜头内按「预估表演时长/景别/运镜/画面内容/角色台词/音效/特效」固定顺序；**每镜头必标【重点表演】⭐**（重点表演内容+表演目的），每段首镜挂【吸睛开场】⭐、末镜挂【结尾钩子】⭐（可假镜头）。**文档末尾**：交付前做导演3.0最终复查确认（同段相邻镜头衔接/切镜逻辑/站位光影跨镜承接/台词完整念完/时长合规/矛盾BUG 六项）。时长规则 v2.10 硬性铁律继续保留：台词（念出来的）4 字/秒、内心独白/背景旁白 5 字/秒（英文台词 3-3.5 词/秒，双语取较长者）逐镜头取整，镜头时长必须 ≥ 台词所需秒数（台词必须念完）；单镜头绝不超过 4s（单调镜头 1-4s）；台词超 4s 必须在标点/语义断点处拆镜或做更丰富运镜延展；每段 ≤15s；连续 OS/旁白跨镜不中断、按总字数分摊；以上为制作层要求，提示词内仅弱提示「约Xs」、不写死精确时间码。情绪与表情一致性：人物前后表情情绪一致、情绪细节精细到呼吸起伏、面部细节融入画面内容不单独分列。保留 1.11 官方对齐资产（八要素公式/三类任务/主体绑定/动作量化/情绪外化表/约束词/素材配置/12 项常见问题/英文气口断句/黄金三幕/三标记/物料设计）+ 四文件交付（分镜脚本 .docx + 人物设计参考 .docx+.xlsx + 场景设计参考 .docx+.xlsx + 服装表 .xlsx）。